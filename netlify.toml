# The site is static: `npm run build` generates every page from content/ into dist/
[build]
  command = "npm run build"
  publish = "dist"

# Uploaded photos are named by a unique ID and never change, so browsers can keep them for a year
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
